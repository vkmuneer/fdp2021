{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h4 class="text-bw-teal mb-3"><i class="bi bi-gear"></i> Settings</h4>

<div class="card bw-card" style="max-width: 560px;">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Academy Name</label>
        <input type="text" name="academy_name" class="form-control" value="{{ settings.academy_name }}">
      </div>
      <hr>
      <h6 class="text-bw-teal">Fee Payment Link (GPay / UPI)</h6>
      <p class="text-muted small">
        Set the administrator's UPI ID here to enable "Pay via GPay/UPI" links in fee
        reminder WhatsApp messages sent to parents.
      </p>
      <div class="mb-3">
        <label class="form-label">UPI ID (e.g. yourname@okaxis, yourname@ybl)</label>
        <input type="text" name="upi_id" class="form-control" placeholder="admin@okaxis" value="{{ settings.upi_id or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Payee Name (shown to parents in GPay)</label>
        <input type="text" name="upi_payee_name" class="form-control" placeholder="Brainwave Academy" value="{{ settings.upi_payee_name or '' }}">
      </div>
      <button type="submit" class="btn btn-bw-primary">Save Settings</button>
    </form>
  </div>
</div>
{% endblock %}
