{% extends "base.html" %}
{% block title %}Create Exam{% endblock %}
{% block content %}
<h4 class="text-bw-teal mb-3">Create Exam</h4>
<div class="card bw-card">
  <div class="card-body">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">Exam Name *</label>
          <input type="text" name="name" class="form-control" required placeholder="e.g. First Term Exam 2026">
        </div>
        <div class="col-md-4">
          <label class="form-label">Class *</label>
          <select name="class_id" class="form-select" required>
            {% for c in classes %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Exam Date</label>
          <input type="date" name="exam_date" class="form-control" value="{{ today.isoformat() }}">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <input type="text" name="description" class="form-control" placeholder="Optional notes">
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-bw-primary">Create Exam &amp; Add Subjects</button>
        <a href="{{ url_for('admin.exams') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
