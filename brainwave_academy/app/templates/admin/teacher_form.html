{% extends "base.html" %}
{% block title %}{{ 'Edit' if teacher else 'Add' }} Teacher{% endblock %}
{% block content %}
<h4 class="text-bw-teal mb-3">{{ 'Edit' if teacher else 'Add' }} Teacher</h4>
<div class="card bw-card">
  <div class="card-body">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full Name *</label>
          <input type="text" name="name" class="form-control" required value="{{ teacher.name if teacher else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Login Username *</label>
          <input type="text" name="username" class="form-control" required
                 value="{{ teacher.user.username if teacher else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ teacher.phone if teacher else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">{{ 'Reset Password' if teacher else 'Password *' }}</label>
          <input type="password" name="password" class="form-control" {{ 'required' if not teacher }}
                 placeholder="{{ 'Leave blank to keep current password' if teacher else '' }}">
        </div>
        <div class="col-12">
          <label class="form-label">
            Subjects Handling
            {% if not subjects %}<span class="text-muted small">(none defined yet - add some under <a href="{{ url_for('admin.masters') }}">Master Data</a>)</span>{% endif %}
          </label>
          <div class="row">
            {% for s in subjects %}
            <div class="col-6 col-md-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="subject_ids" value="{{ s.id }}"
                       id="subj{{ s.id }}"
                       {{ 'checked' if teacher and s in teacher.subjects }}>
                <label class="form-check-label" for="subj{{ s.id }}">{{ s.name }}</label>
              </div>
            </div>
            {% endfor %}
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">Assigned Classes / Divisions</label>
          <div class="row">
            {% for c in classes %}
              {% for d in c.divisions %}
              <div class="col-6 col-md-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="division_ids" value="{{ d.id }}"
                         id="div{{ d.id }}"
                         {{ 'checked' if teacher and d in teacher.divisions }}>
                  <label class="form-check-label" for="div{{ d.id }}">{{ c.name }}-{{ d.name }}</label>
                </div>
              </div>
              {% endfor %}
            {% endfor %}
          </div>
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-bw-primary">Save Teacher</button>
        <a href="{{ url_for('admin.teachers') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
