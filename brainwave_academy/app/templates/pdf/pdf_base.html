<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4; margin: 1.6cm; }
  body { font-family: Helvetica, Arial, sans-serif; font-size: 11px; color: #1c3f63; }
  .header { text-align: center; margin-bottom: 14px; border-bottom: 2px solid #36b6a8; padding-bottom: 8px; }
  .header h1 { color: #155e52; font-size: 20px; margin: 2px 0; }
  .header .sub { color: #6b7280; font-size: 10px; margin: 2px 0; }
  table { width: 100%; margin-top: 10px; }
  th, td { border: 1px solid #cbd5e1; padding: 5px 7px; text-align: left; font-size: 10px; }
  th { background-color: #e6f4f2; color: #155e52; }
  .totals-row td { font-weight: bold; background-color: #f4f8f8; }
  .text-right { text-align: right; }
  .text-center { text-align: center; }
  .muted { color: #6b7280; }
  .summary { margin-bottom: 6px; }
  .summary span { display: inline-block; margin-right: 18px; font-size: 11px; }
  .summary b { color: #155e52; }
  .footer { margin-top: 18px; color: #9ca3af; font-size: 8px; text-align: center; }
  {% block extra_style %}{% endblock %}
</style>
</head>
<body>
  <div class="header">
    <h1>{{ (settings.academy_name if settings else None) or "Brainwave Academy" }}</h1>
    <div class="sub">{% block report_title %}Report{% endblock %}</div>
    <div class="sub">Generated on {{ today.strftime('%d-%m-%Y') }}</div>
  </div>

  {% block pdf_content %}{% endblock %}

  <div class="footer">Brainwave Academy Management System</div>
</body>
</html>
